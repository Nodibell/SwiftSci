codecov:
  notify:
    require_ci_to_pass: yes

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  # Exclude GPU/MLX-dependent source modules skipped in CI runner
  - "Sources/SwiftML/**"
  - "Sources/SwiftCluster/**"
  - "Sources/SwiftPrivacy/**"
  - "Sources/SwiftExplain/**"
  - "Sources/SwiftPreprocessing/**"
  - "Sources/SwiftOptimize/**"
  - "Sources/SwiftLLM/**"
  - "Sources/SwiftVision/**"
  - "Sources/SwiftWorkflow/**"
  # Exclude test files from code coverage calculation
  - "Tests/**"
  # Exclude CLI executable and standalone benchmarks from library patch coverage
  - "Sources/SwiftSciCLI/**"
  - "Benchmarks/**"

