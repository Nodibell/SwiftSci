[project]
name = "swiftsci-benchmarks"
version = "0.1.0"
description = "Standardized benchmark, conformance, and scientific validation runner for SwiftSci"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "scipy==1.18.1",
    "pyarrow==25.0.1",
    "mpmath==1.4.1",
]

[project.optional-dependencies]
comparison = [
    "polars==1.44.2",
    "polars-runtime-32==1.44.2",
    "duckdb==1.5.6",
]
mlx = [
    "mlx==0.31.1",
    "mlx-metal==0.31.1",
]
scientific = [
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "shap>=0.42.0",
]
all = [
    "swiftsci-benchmarks[comparison,mlx,scientific]",
]

[tool.uv]
package = false
