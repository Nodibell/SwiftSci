name: SwiftSci CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_PACKAGE_DIR: "."
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Debug Build
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build (Debug)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest"

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftsci-spm-v3-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftsci-spm-v3-

      - name: Build
        run: swift build -v


  # ─────────────────────────────────────────────────────────────
  # 2. Release Build
  # ─────────────────────────────────────────────────────────────
  build-release:
    name: Build (Release)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest"

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftsci-spm-v3-rel-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftsci-spm-v3-rel-

      - name: Build Release
        run: swift build -c release


  # ─────────────────────────────────────────────────────────────
  # 3. Unit Tests + Coverage
  # ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (Safe Mode)
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest"

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftsci-spm-v3-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftsci-spm-v3-

      - name: Run safe unit tests
        run: |
          swift test --enable-code-coverage -v \
            --skip SwiftMLTests \
            --skip SwiftClusterTests \
            --skip SwiftForecastTests \
            --skip SwiftPrivacyTests \
            --skip SwiftExplainTests \
            --skip SwiftPreprocessingTests \
            --skip SwiftOptimizeTests \
            --skip SwiftLLMTests \
            --skip SwiftVisionTests

          # GPU-dependent suites are skipped because GitHub macOS runners
          # do not provide the Metal GPU environment required by MLX.
          #
          # SwiftPreprocessingTests:
          #   SwiftPreprocessing links MLX directly and may crash at load time.
          #
          # SwiftOptimizeTests:
          #   SwiftOptimize -> SwiftML -> SwiftPreprocessing -> MLX.
          #
          # SwiftLLMTests:
          #   Tests create MLX arrays at runtime.
          #
          # SwiftVisionTests:
          #   YOLOv8 / U-Net forward passes require MLX Metal GPU.

      - name: Export coverage
        run: |
          BUILD_DIR=$(swift build --show-bin-path -c debug)
          PROFDATA=".build/debug/codecov/default.profdata"

          TEST_BINS=$(
            find "$BUILD_DIR" -name "*.xctest" -type d |
            while read -r d; do
              echo "$d/Contents/MacOS/$(basename "${d%.xctest}")"
            done |
            tr '\n' ' '
          )

          xcrun llvm-cov export \
            -format="lcov" \
            -instr-profile="$PROFDATA" \
            $TEST_BINS > coverage.lcov || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false


  # ─────────────────────────────────────────────────────────────
  # 4. DocC Documentation Coverage
  # ─────────────────────────────────────────────────────────────
  docc-check:
    name: DocC Documentation Coverage Check
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest"

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftsci-spm-v3-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftsci-spm-v3-

      - name: Build DocC documentation
        run: |
          swift package generate-documentation \
            --target SwiftDataFrame \
            --target SwiftStats \
            --target SwiftPreprocessing \
            --target SwiftML \
            --target SwiftCluster \
            --target SwiftNLP \
            --target SwiftOptimize \
            --target SwiftForecast \
            --target SwiftLLM \
            --target SwiftExplain \
            --target SwiftVisualization \
            --target SwiftVision \
            --target SwiftDatabase \
            --target SwiftAgent

      - name: Verify documentation was generated
        run: |
          if [ ! -d "docs/data" ] && [ ! -d "docs/documentation" ]; then
            echo "❌ Documentation generation failed - no documentation output found."
            exit 1
          fi

          echo "✓ Documentation generated successfully."

      - name: Verify Public API Documentation Coverage (100%)
        run: |
          python3 scripts/verify_doc_coverage.py


  # ─────────────────────────────────────────────────────────────
  # 5. Performance Regression Check
  # ─────────────────────────────────────────────────────────────
  performance-check:
    name: Performance Regression Check (Disabled in CI)
    runs-on: macos-latest

    steps:
      - name: Skip due to GPU requirements
        run: |
          echo "Benchmarks require a GPU-enabled runner."
          echo "Skipping performance regression check."


  # ─────────────────────────────────────────────────────────────
  # 6. Deploy Documentation to GitHub Pages (main branch only)
  # ─────────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build, docc-check]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

