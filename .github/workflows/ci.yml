name: SwiftSci CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_PACKAGE_DIR: "."
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  # 1. Debug Build
  build:
    name: Build (Debug)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: 'latest' }
      - uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftsci-spm-v3-${{ hashFiles('**/Package.resolved') }}
      - run: swift build -v

  # 2. Release Build (catches WMO warnings missed in debug)
  build-release:
    name: Build (Release)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: 'latest' }
      - uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftsci-spm-v3-rel-${{ hashFiles('**/Package.resolved') }}
      - run: swift build -c release

  # 3. Test
  test:
    name: Unit Tests (Safe Mode)
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: 'latest' }
      - uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftsci-spm-v3-${{ hashFiles('**/Package.resolved') }}
      
      - name: Run safe unit tests
        run: |
          swift test --enable-code-coverage -v \
            --skip SwiftMLTests \
            --skip SwiftClusterTests \
            --skip SwiftForecastTests \
            --skip SwiftPrivacyTests \
            --skip SwiftExplainTests \
            --skip SwiftPreprocessingTests \
            --skip SwiftOptimizeTests \
            --skip SwiftLLMTests \
            --skip SwiftVisionTests
          # Skipped: GPU-dependent tests (MLX requires Metal; no GPU on CI runners)
          # SwiftPreprocessingTests: SwiftPreprocessing links MLX directly → crashes at load
          # SwiftOptimizeTests:      SwiftOptimize → SwiftML → SwiftPreprocessing → MLX
          # SwiftLLMTests:           Both suites create MLX arrays at runtime
          # SwiftVisionTests:        YOLOv8 & U-Net neural network forward pass requires MLX Metal GPU
        
      - name: Export coverage
        run: |
          BUILD_DIR=$(swift build --show-bin-path -c debug)
          PROFDATA=".build/debug/codecov/default.profdata"
          TEST_BINS=$(find "$BUILD_DIR" -name "*.xctest" -type d | while read d; do echo "$d/Contents/MacOS/$(basename "${d%.xctest}")"; done | tr '\n' ' ')
          xcrun llvm-cov export -format="lcov" -instr-profile="$PROFDATA" $TEST_BINS > coverage.lcov || true
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false


  # 4. DocC Documentation Coverage Check
  docc-check:
    name: DocC Documentation Coverage Check
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: 'latest' }
      - uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftsci-spm-v3-${{ hashFiles('**/Package.resolved') }}
      - name: Build DocC documentation and verify symbol coverage
        run: |
          swift package generate-documentation \
            --target SwiftDataFrame \
            --target SwiftStats \
            --target SwiftPreprocessing \
            --target SwiftML \
            --target SwiftCluster \
            --target SwiftNLP \
            --target SwiftOptimize \
            --target SwiftForecast \
            --target SwiftLLM \
            --target SwiftExplain \
            --target SwiftVisualization \
            --target SwiftVision \
            --target SwiftDatabase \
            --target SwiftAgent \
            --warnings-as-errors

      - name: Verify Public API Documentation Coverage (100%)
        run: python3 scripts/verify_doc_coverage.py

      - name: Verify Published Documentation Freshness (docs/ staleness check)
        run: |
          ./scripts/build_unified_docs.sh
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "❌ Error: The published documentation in docs/ is stale relative to public API changes."
            echo "Please run ./scripts/build_unified_docs.sh locally and commit the updated docs/ directory."
            git status --porcelain docs/
            exit 1
          fi


  # 5. Benchmark
  performance-check:
    name: Performance Regression Check (Disabled in CI)
    runs-on: macos-latest
    steps:
      - name: Skip due to GPU requirements
        run: echo "Benchmarks require GPU-enabled runner. Skipping."